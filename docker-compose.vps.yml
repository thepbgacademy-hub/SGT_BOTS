services:
  caddy:
    image: caddy:2.8-alpine
    container_name: telegram-playground-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - proxy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: telegram-playground-frontend
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - app
      - proxy

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: telegram-playground-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_PORT: 3000
      PROFILE_REPO_MODE: supabase
      PROVIDER_VALIDATION_MODE: live
    expose:
      - "3000"
    networks:
      - app
      - proxy

networks:
  app:
    driver: bridge
  proxy:
    external: true
    name: proxy

volumes:
  caddy_data:
  caddy_config:
