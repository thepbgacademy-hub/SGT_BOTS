services:
  sgt-bots-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - web-proxy

  sgt-bots-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_PORT: 3000
      PLAYGROUND_PARTICIPATION_BYPASS_TELEGRAM_USER_IDS: ${PLAYGROUND_PARTICIPATION_BYPASS_TELEGRAM_USER_IDS:-}
      PROFILE_REPO_MODE: supabase
      PROVIDER_VALIDATION_MODE: live
    expose:
      - "3000"
    networks:
      - web-proxy
      - supabase_default

networks:
  web-proxy:
    external: true
  supabase_default:
    external: true
